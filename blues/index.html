<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブルース・バックトラック</title>
<style>
:root{
  --bg:#14110f; --panel:#1e1a17; --panel2:#27211d; --line:#3a312a;
  --text:#efe6dc; --sub:#a8998a; --accent:#e0a040; --accent2:#4f8fd8; --hot:#e0573c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Hiragino Sans","Helvetica Neue",sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:.04em}
.lead{color:var(--sub);margin:0 0 16px;font-size:13px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:12px;color:var(--sub);font-weight:600;margin:0 0 10px;letter-spacing:.08em}
label.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
label.row span{color:var(--sub);font-size:13px;white-space:nowrap}
select,input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
select{flex:1;max-width:210px}
input[type=number]{width:72px}
input[type=range]{accent-color:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:6px}
.keys button{padding:6px 0}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit;cursor:pointer;padding:7px 12px}
button:hover{border-color:var(--sub)}
button.on{background:var(--accent);color:#1a1208;border-color:var(--accent);font-weight:700}
.check{display:flex;align-items:center;gap:8px;margin:7px 0;color:var(--sub);font-size:13px}
.transport{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#play{font-size:16px;padding:10px 22px;background:var(--accent);color:#1a1208;border:none;font-weight:700;min-width:120px}
#play.playing{background:var(--hot);color:#fff}
.now{display:flex;align-items:baseline;gap:14px;flex:1;min-width:220px}
#chordNow{font-size:44px;font-weight:800;letter-spacing:.02em;min-width:130px}
#chordNext{color:var(--sub);font-size:16px}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);text-align:right}
.clock b{color:var(--text);font-size:18px}
.beats{display:flex;gap:6px;margin-top:6px}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.beats i.on{background:var(--accent);border-color:var(--accent)}
#form{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
#form div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px 6px;text-align:center;font-weight:700;font-size:16px;position:relative}
#form div small{position:absolute;left:6px;top:3px;font-size:10px;color:var(--sub);font-weight:400}
#form div.cur{background:#3b2c14;border-color:var(--accent);color:var(--accent)}
#timeline{display:flex;gap:3px;margin-top:12px;height:30px}
#timeline div{background:var(--panel2);border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden;white-space:nowrap;position:relative}
#timeline div:hover{border-color:var(--sub)}
#timeline div.cur{border-color:var(--accent);color:var(--accent)}
#timeline div.stop{background:#2a1f30}
#timeline div .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(224,160,64,.18)}
.tlnote{color:var(--sub);font-size:12px;margin-top:6px}
.mixer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#lyricNow{margin-top:12px;font-size:18px;min-height:28px;letter-spacing:.01em}
#lyricNow span{color:var(--sub);transition:color .08s}
#lyricNow span.on{color:var(--accent)}
#lyricNow .idle{font-size:13px;color:var(--sub)}
.verses{font-size:13px;line-height:1.7;margin-top:8px}
.verses p{margin:0 0 8px}
.verses b{color:var(--accent);font-weight:600;font-size:12px}
.ch{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.ch b{display:block;font-size:13px;margin-bottom:4px}
.ch input{width:100%}
.ch button{margin-top:6px;padding:4px 10px;font-size:12px}
.ch button.muted{background:var(--hot);border-color:var(--hot);color:#fff}
.export{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#status{color:var(--sub);font-size:12px}
.hint{font-size:13px;color:var(--sub)}
.hint b{color:var(--text)}
.tones{margin-top:6px;font-size:14px}
.tones span{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;margin:2px 4px 2px 0;color:var(--text)}
.tones span.r{border-color:var(--accent);color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:16px}
.summary{font-size:13px;color:var(--sub);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.summary b{color:var(--text)}
</style>
</head>
<body>
<main>
  <h1>ブルース・バックトラック</h1>
  <p class="lead">ギター練習用。キー・リズム・進行を選んで再生するだけ。長さは基本 3分30秒（イントロ4小節 → 12小節×コーラス → エンディング）。</p>

  <div class="grid">
    <div class="stack">
      <section class="card">
        <h2>プリセット</h2>
        <label class="row"><span>バンド風</span><select id="preset"><option value="">— 選ぶと一式セット —</option></select></label>
        <h2 style="margin-top:12px">キー</h2>
        <div class="keys" id="keys"></div>
        <label class="row"><span>リズム</span><select id="style"></select></label>
        <label class="row"><span>進行</span><select id="prog"></select></label>
        <label class="row"><span>テンポ</span>
          <input type="range" id="bpmRange" min="50" max="200" step="1" style="flex:1">
          <input type="number" id="bpm" min="40" max="240" step="1">
        </label>
        <label class="row"><span>長さ</span><select id="len"></select></label>
        <label class="check"><input type="checkbox" id="fit">長さぴったりになるようテンポを微調整</label>
        <label class="check"><input type="checkbox" id="stopTime">中盤にストップタイムを1コーラス入れる</label>
        <label class="check"><input type="checkbox" id="vocal">ボーカル（英詞の仮歌）を付ける</label>
        <label class="row"><span>歌詞の雰囲気</span><select id="mood"><option value="auto">曲に合わせる（自動）</option></select></label>
        <label class="check"><input type="checkbox" id="countIn" checked>再生前に1小節カウント</label>
        <label class="row"><span>鍵盤の音</span><select id="keysSound">
          <option value="organ">オルガン</option>
          <option value="ep">エレピ</option>
          <option value="piano">ピアノ</option>
        </select></label>
        <div class="summary" id="summary"></div>
      </section>

      <section class="card">
        <h2>ミキサー</h2>
        <div class="mixer" id="mixer"></div>
      </section>

      <section class="card">
        <h2>書き出し</h2>
        <div class="export">
          <button id="dlMidi">MIDI（Logic 用）</button>
          <button id="dlWav">WAV（オーディオ）</button>
          <button id="dlSvp" title="Synthesizer V Studio 2（Mai 2・英語）で開くボーカルのプロジェクト">🎤 SynthV ボーカル（.svp）</button>
        </div>
        <div id="status" style="margin-top:6px"></div>
      </section>
    </div>

    <div class="stack">
      <section class="card">
        <div class="transport">
          <button id="play">▶ 再生</button>
          <div class="now">
            <div id="chordNow">—</div>
            <div>
              <div id="chordNext">次: —</div>
              <div class="beats" id="beats"><i></i><i></i><i></i><i></i></div>
            </div>
          </div>
          <div class="clock"><b id="tNow">0:00</b> / <span id="tTotal">0:00</span><br><span id="where">停止中</span></div>
        </div>
        <div id="lyricNow"></div>
      </section>

      <section class="card">
        <h2>12小節フォーム</h2>
        <div id="form"></div>
        <div id="timeline"></div>
        <div class="tlnote">上の帯をクリックすると、そのセクションの頭から再生します（スペースキーで再生/停止）。</div>
      </section>

      <section class="card">
        <h2>ボーカル（英詞）</h2>
        <div class="hint" id="vocalInfo"></div>
        <div class="verses" id="verses"></div>
      </section>

      <section class="card">
        <h2>ソロのヒント</h2>
        <div class="hint" id="scaleHint"></div>
        <div class="hint" style="margin-top:8px">今のコードのコードトーン:</div>
        <div class="tones" id="tones"></div>
      </section>
    </div>
  </div>
</main>

<script id="core">
// ===== 曲データ生成（UI・音源から独立。MIDI 書き出しとプレビュー再生で共通） =====
const PPQ = 480, BAR = PPQ * 4;
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLAT_KEYS = [0,5,10,3,8,1,6]; // C F Bb Eb Ab Db Gb

const STYLES = {
  shuffle:  { name:'シャッフル',              tag:'Shuffle',  bpm:102 },
  straight: { name:'ストレート8（ロック）',    tag:'Straight', bpm:116 },
  slow:     { name:'スロー・ブルース（12/8）', tag:'Slow',     bpm:61  },
  jazz:     { name:'ジャズ・スウィング（4ビート）', tag:'Jazz', bpm:129 },
  heavy:    { name:'ヘヴィ・ブルースロック（Cream風）', tag:'Heavy', bpm:116, rock:true },
  funk:     { name:'16ビート・ファンクロック（Hendrix風）', tag:'FunkRock', bpm:102, rock:true },
  half:     { name:'ヘヴィ・ハーフタイム（Zeppelin風）', tag:'HalfTime', bpm:74, rock:true },
};

const c = (d, q) => ({ d, q });
const I = c(0,'7'), IV = c(5,'7'), V = c(7,'7');
const PROGS = {
  basic: { name:'12小節（基本）', tag:'12bar', minor:false,
    bars:[[I],[I],[I],[I],[IV],[IV],[I],[I],[V],[IV],[I],[V]] },
  quick: { name:'12小節（クイックチェンジ）', tag:'Quick', minor:false,
    bars:[[I],[IV],[I],[I],[IV],[IV],[I],[I],[V],[IV],[I],[V]] },
  minor: { name:'マイナー・ブルース', tag:'Minor', minor:true,
    bars:[[c(0,'m7')],[c(0,'m7')],[c(0,'m7')],[c(0,'m7')],[c(5,'m7')],[c(5,'m7')],
          [c(0,'m7')],[c(0,'m7')],[c(8,'7')],[V],[c(0,'m7')],[V]] },
  jazz:  { name:'ジャズ・ブルース', tag:'JazzBlues', minor:false,
    bars:[[I],[IV],[I],[c(7,'m7'),I],[IV],[c(6,'dim7')],[I],[c(9,'7')],
          [c(2,'m7')],[V],[I,c(9,'7')],[c(2,'m7'),V]] },
  // --- ロック系（パワーコード／7(#9)／メジャー・トライアド） ---
  rock5: { name:'ブルースロック（パワーコード）', tag:'Rock5', minor:false, rock:true,
    hint:k => `<b>${k}マイナー・ペンタ</b>一本で押し切れる進行。3度のないパワーコードなので、チョーキングで短3度→長3度の間を揺らすとブルースロックらしくなります。`,
    bars:[[c(0,'5')],[c(0,'5')],[c(0,'5')],[c(0,'5')],[c(5,'5')],[c(5,'5')],
          [c(0,'5')],[c(0,'5')],[c(7,'5')],[c(5,'5')],[c(0,'5')],[c(7,'5')]] },
  sharp9: { name:'7(#9) ヴァンプ', tag:'Sharp9', minor:false, rock:true,
    hint:k => `<b>${k}マイナー・ペンタ</b>が軸。伴奏は 3度を抜いてあるので、${k}7(#9) の長3度と #9 のぶつかりはギター側で鳴らせます。9〜10小節目の ♭VII→IV はメジャー・コードなので、ミクソリディアンでつなぐと自然です。`,
    bars:[[c(0,'7#9')],[c(0,'7#9')],[c(0,'7#9')],[c(0,'7#9')],[c(5,'7#9')],[c(5,'7#9')],
          [c(0,'7#9')],[c(0,'7#9')],[c(10,'M')],[c(5,'M')],[c(0,'7#9')],[c(7,'7#9')]] },
  descend: { name:'5度下降ロック進行（♭VI→♭III→♭VII→IV→I）', tag:'Descend', minor:false, rock:true,
    hint:k => `全部メジャー・コード。<b>${k}マイナー・ペンタ</b>でも弾けますが、各コードのルートと3度を拾って歌わせると進行の流れが出ます。`,
    bars:[[c(8,'M'),c(3,'M')],[c(10,'M'),c(5,'M')],[c(0,'5')],[c(0,'5')],
          [c(8,'M'),c(3,'M')],[c(10,'M'),c(5,'M')],[c(0,'5')],[c(0,'5')],
          [c(8,'M'),c(3,'M')],[c(10,'M'),c(5,'M')],[c(0,'5')],[c(7,'5')]] },
  mixo: { name:'ミクソリディアン・リフロック（♭VII・♭III入り）', tag:'Mixo', minor:false, rock:true,
    hint:k => `<b>${k}マイナー・ペンタ</b>＋<b>${k}ミクソリディアン</b>。♭VII と ♭III はマイナー・ペンタの音から作れるコードなので、リフの延長で弾けます。`,
    bars:[[c(0,'5')],[c(0,'5')],[c(10,'M'),c(5,'M')],[c(0,'5')],[c(5,'5')],[c(5,'5')],
          [c(0,'5')],[c(3,'M'),c(5,'M')],[c(7,'5')],[c(10,'M'),c(5,'M')],[c(0,'5')],[c(7,'5')]] },
};

const PRESETS = [
  { name:'Cream風｜ヘヴィ・ブルースロック', style:'heavy', prog:'rock5',   key:9,  bpm:116 },
  { name:'Cream風｜高速シャッフル',         style:'shuffle', prog:'quick', key:9,  bpm:132 },
  { name:'Hendrix風｜7(#9) ファンクロック', style:'funk',  prog:'sharp9',  key:4,  bpm:102 },
  { name:'Hendrix風｜スロー・ブルース',     style:'slow',  prog:'basic',   key:11, bpm:61 },
  { name:'Hendrix風｜5度下降ロック',         style:'heavy', prog:'descend', key:4,  bpm:102 },
  { name:'Zeppelin風｜ヘヴィ・ハーフタイム', style:'half',  prog:'mixo',    key:9,  bpm:74 },
  { name:'Zeppelin風｜スロー・マイナーブルース', style:'slow', prog:'minor', key:0, bpm:61 },
];

// ===== 仮歌の英詞（SynthV 用）。全単語1音節＝1音符1単語（多音節語は SynthV の英語読みが崩れるため使わない）
// ブルースの AAB 形式：A を2回歌って B で答える。各コーラスで歌うのは1番ずつ
const LYRICS = {
  classic: { name:'旅立ち・ロード（定番ブルース）', title:'Last Train Out', verses:[
    ['Packed my bag, caught the last train out of town', 'No more long nights and no more cold rain'],
    ['Got one dime, got one song, got these worn out shoes', "I'll walk this road till the sun comes up"],
    ['When the wheels roll slow I can hear the blues', "Ride on, ride on, I won't look back"] ] },
  slow: { name:'深夜の失恋（スロー）', title:'Rain Falls Down', verses:[
    ['Late last night I heard the rain fall down', 'You took your coat, you left this old heart cold'],
    ['I sit and stare at the door you closed', 'Each tick of the clock just sings your name'],
    ["Pour me one more glass, I'll drink till dawn", "When the sun comes up, I'll let you go"] ] },
  minor: { name:'冷たい月・闇（マイナー）', title:'Cold Moon Road', verses:[
    ['Cold moon hangs low on the black dirt road', "I made my deal and my soul's not my own"],
    ["Wind cries through the pines like a lost child's voice", "Don't call my name when the dark comes round"],
    ['Ash and smoke where my house once stood', 'Still I walk on through the long cold night'] ] },
  jazz: { name:'煙るナイトクラブ（ジャズ）', title:'Last Call', verses:[
    ['Blue smoke curls in the low lamp light', 'The horns play soft while the town sleeps tight'],
    ['She wore red silk and a slow sweet smile', "One more round, Joe, and I'll stay a while"],
    ['Last call comes but the band plays on', "We'll dance till the stars are gone"] ] },
  cream: { name:'灼けた空・ヘヴィ（Cream風）', title:'Black Sun Ride', verses:[
    ['Sun burns black on the edge of the world', 'I ride the storm with my head held high'],
    ['Your eyes shine bright like the stars at dawn', "But your heart's a stone and your love's a lie"],
    ['Turn it up loud, let the whole room shake', 'Blues in my blood till the day I break'] ] },
  hendrix: { name:'宇宙・電気の嵐（Hendrix風）', title:'Red Sky Dawn', verses:[
    ['Red sky bleeds on a strange new dawn', 'The stars spin round and the ground feels gone'],
    ['Bolt of light cracks through the strings in my hand', 'I float on sound to a far off land'],
    ['Let the storm sing loud, let the wild wind blow', "Take my hand, I'll show you where to go"] ] },
  zep: { name:'北の海・神話（Zeppelin風）', title:'Ship of Stone', verses:[
    ['From the north I came on a ship of stone', 'Through ice and storm I sail on my own'],
    ['The sea calls my name in the cold gray dawn', 'Wolves howl high on the hill where I was born'],
    ["Gold and blood on the old king's crown", "I'll fight till the last star falls down"] ] },
};
function moodFor(style, prog) {
  if (prog === 'rock5') return 'cream';
  if (prog === 'sharp9' || prog === 'descend') return 'hendrix';
  if (prog === 'mixo') return 'zep';
  if (style === 'heavy') return 'cream';
  if (style === 'funk') return 'hendrix';
  if (style === 'half') return 'zep';
  if (prog === 'minor') return 'minor';
  if (prog === 'jazz' || style === 'jazz') return 'jazz';
  if (style === 'slow') return 'slow';
  return 'classic';
}
// 歌うコーラス：1・2コーラス目と最後（間はギター・ソロ）
const vocalChorusesFor = N => N >= 4 ? [0, 1, N - 1] : N === 3 ? [0, 2] : N === 2 ? [0, 1] : [0];

const QNAME = { '7':'7', 'm7':'m7', 'dim7':'dim7', '5':'5', 'M':'', '7#9':'7(#9)' };
function noteName(pc, key, prog, q) {
  const useFlat = q !== 'dim7' && (FLAT_KEYS.includes(key) || PROGS[prog].minor);
  return (useFlat ? FLAT : SHARP)[((pc % 12) + 12) % 12];
}
function chordName(root, q, key, prog) { return noteName(root, key, prog, q) + QNAME[q]; }
const CHORD_TONES = { '7':[0,4,7,10], 'm7':[0,3,7,10], 'dim7':[0,3,6,9], '5':[0,7], 'M':[0,4,7], '7#9':[0,4,7,10,15] };
const TONE_LABEL = { '7':'R・3・5・♭7', 'm7':'R・♭3・5・♭7', 'dim7':'R・♭3・♭5・𝄫7', '5':'R・5', 'M':'R・3・5', '7#9':'R・3・5・♭7・#9' };

// 構成: イントロ4小節（フォームの9〜12小節＝ターンアラウンド）+ 12小節×N + エンディング（最後の小節の頭で一発）+ 余韻1小節
function planLength(bpm, targetSec, fit) {
  const barSec = 240 / bpm;
  const n = Math.max(1, Math.round((targetSec / barSec - 5) / 12));
  const totalBars = 4 + 12 * n + 1;
  let realBpm = bpm;
  if (fit) realBpm = Math.min(240, Math.max(40, Math.round(240 * totalBars / targetSec * 10) / 10));
  return { choruses: n, totalBars, bpm: realBpm, sec: totalBars * 240 / realBpm };
}

function buildSong(o) {
  const P = PROGS[o.prog], S = o.style;
  const plan = planLength(o.bpm, o.targetSec, o.fit);
  const N = plan.choruses;
  const stopChorus = o.stopTime && N >= 3 ? Math.floor(N / 2) : -1;
  const tonic = P.bars.flat().find(ch => ch.d === 0);
  const bars = [];
  const pushBar = (formBar, section, chorus, flags) => {
    const t0 = bars.length * BAR;
    let src = P.bars[formBar];
    if (flags.endA && src.length > 1) src = [src[0]];   // エンディング直前は1小節1コード
    if (flags.end || flags.ring) src = [tonic];   // 終止は必ず I（♭VI 始まりの進行でも）
    const len = BAR / src.length;
    const segs = src.map((ch, i) => ({ root: (o.key + ch.d) % 12, q: ch.q, s: t0 + i * len, e: t0 + (i + 1) * len }));
    bars.push({ index: bars.length, t0, formBar, section, chorus, segs, ...flags });
  };
  for (let b = 8; b < 12; b++) pushBar(b, 'intro', -1, { fill: b === 11 });
  for (let k = 0; k < N; k++) {
    const last = k === N - 1;
    for (let b = 0; b < 12; b++) {
      if (last && b === 11) { pushBar(b, 'end', k, { end: true }); continue; }
      pushBar(b, k === stopChorus ? 'stop' : 'chorus', k, {
        crash: b === 0, fill: b === 11, stop: k === stopChorus && b < 4, endA: last && b === 10,
      });
    }
  }
  pushBar(0, 'ring', N - 1, { ring: true });

  const segsAll = bars.flatMap(b => b.segs.map(s => ({ ...s, bar: b })));
  const ev = [];
  const hash = n => { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0); };
  const add = (part, tick, dur, note, vel) => {
    const v = Math.max(1, Math.min(127, Math.round(vel + ((hash(tick * 131 + note * 7) % 13) - 6))));
    ev.push({ part, tick, dur: Math.max(10, Math.round(dur)), note, vel: v });
  };
  const intensity = bar => {
    if (bar.section === 'intro') return 0.8;
    if (bar.end || bar.ring) return 1;
    if (N === 1) return 0.95;
    return 0.84 + 0.16 * (bar.chorus / (N - 1));
  };

  // --- 鍵盤ボイシング（ルートなし。ベースと短2度でぶつからない形に固定） ---
  // 7(#9) は 3度を抜いた ♭7・#9・5（長3度と #9 の衝突はギター側に任せる）
  const ROCKV = { '5':[7,12,19], 'M':[4,7,12], '7#9':[10,15,19] };
  const VOICE = S === 'jazz'
    ? { '7':[4,10,14], 'm7':[3,7,10], 'dim7':[3,6,9], ...ROCKV }
    : { '7':[4,7,14],  'm7':[3,7,10], 'dim7':[3,6,9], ...ROCKV };
  const END = { '7':[4,10,14], 'm7':[3,7,10], 'dim7':[3,6,9], ...ROCKV };
  const voicing = (root, q, end) => {
    const iv = end ? END[q] : VOICE[q];
    let notes = iv.map(x => 48 + root + x);
    while (notes[0] < 55) notes = notes.map(n => n + 12);
    while (notes[0] >= 67) notes = notes.map(n => n - 12);
    return notes;
  };
  const semitoneClash = (n, pcs) => pcs.some(p => { const d = ((n - p) % 12 + 12) % 12; return d === 1 || d === 11; });

  // --- ベース（MODO BASS 2 の鳴る範囲 MIDI 40〜74 に収める） ---
  const bassRoot = pc => 40 + ((pc - 4 + 12) % 12);
  // 'm3'・'4' はリフ用（マイナー・ペンタ）。鍵盤のボイシングと半音でぶつかるコードでは安全な音に置き換える
  const DEG = {
    '7':   { '1':0, '3':4, '5':7, '6':9, 'b7':10, '8':12, 'm3':4, '4':7 },
    'm7':  { '1':0, '3':3, '5':7, '6':5, 'b7':10, '8':12, 'm3':3, '4':5 },
    'dim7':{ '1':0, '3':3, '5':6, '6':9, 'b7':9,  '8':12, 'm3':3, '4':6 },
    '5':   { '1':0, '3':3, '5':7, '6':9, 'b7':10, '8':12, 'm3':3, '4':5 },
    'M':   { '1':0, '3':4, '5':7, '6':9, 'b7':10, '8':12, 'm3':4, '4':7 },
    '7#9': { '1':0, '3':3, '5':7, '6':5, 'b7':10, '8':12, 'm3':3, '4':5 },
  };
  const approach = (seg, next) => {
    const r = bassRoot(seg.root) + DEG[seg.q]['5'];
    if (!next) return r;
    const t = bassRoot(next.root);
    const pcs = voicing(seg.root, seg.q).map(n => n % 12).concat([seg.root]);
    for (const cand of [t - 1, t + 1, t + 7, t - 5, t + 2, t + 11]) {
      if (cand >= 40 && cand <= 74 && cand !== t && !semitoneClash(cand, pcs)) return cand;
    }
    return r;
  };
  const BASS = {
    shuffle:  [[0,300,'1'],[320,150,'3'],[480,300,'5'],[800,150,'6'],[960,300,'b7'],[1280,150,'6'],[1440,300,'5'],[1760,150,'3']],
    straight: [[0,220,'1'],[240,220,'1'],[480,220,'3'],[720,220,'3'],[960,220,'5'],[1200,220,'5'],[1440,220,'6'],[1680,220,'5']],
    slow:     [[0,440,'1'],[480,440,'3'],[960,440,'5'],[1440,300,'6'],[1760,150,'APP']],
    // ペンタトニックのユニゾン・リフ（ギターのリフと重ねる前提）
    heavy:    [[0,200,'1'],[240,200,'1'],[480,200,'m3'],[720,200,'4'],[960,440,'5'],[1440,200,'b7'],[1680,200,'4']],
    funk:     [[0,300,'1'],[360,100,'8'],[480,200,'b7'],[720,200,'1'],[960,200,'m3'],[1200,100,'4'],[1320,100,'5'],[1440,200,'b7'],[1680,180,'5']],
    half:     [[0,420,'1'],[480,200,'m3'],[720,200,'4'],[960,680,'5'],[1680,200,'b7']],
  };
  const KEYS = {
    shuffle:  [[480,200,84],[1440,200,84],[1760,120,64]],
    straight: [[480,200,86],[1200,170,70],[1440,200,86]],
    slow:     [[0,900,78],[960,440,70],[1440,150,60],[1600,150,60],[1760,150,66]],
    heavy:    [[0,900,84],[960,440,74],[1440,200,80]],
    funk:     [[240,100,80],[600,100,70],[1200,100,80],[1560,100,72]],
    half:     [[0,1800,76]],
    jazzA:    [[0,300,78],[800,150,70]],
    jazzB:    [[320,150,68],[1280,180,72]],
  };

  segsAll.forEach((seg, i) => {
    const bar = seg.bar, k = intensity(bar), L = seg.e - seg.s;
    const next = segsAll[i + 1] && !segsAll[i + 1].bar.ring ? segsAll[i + 1] : null;
    if (bar.ring) return;
    const vo = voicing(seg.root, seg.q, bar.end);
    if (bar.end) {
      const d = BAR * 2 - 40;
      add('bass', seg.s, d, bassRoot(seg.root), 100);
      vo.forEach(n => add('keys', seg.s, d, n, 92));
      return;
    }
    if (bar.stop) {
      add('bass', seg.s, 400, bassRoot(seg.root), 104);
      vo.forEach(n => add('keys', seg.s, 400, n, 96));
      return;
    }
    // ベース
    const br = bassRoot(seg.root);
    if (S === 'jazz') {
      const odd = bar.index % 2 === 1;
      const line = L === BAR ? ['1', odd ? '5' : '3', odd ? '3' : '5', 'APP'] : ['1', 'APP'];
      line.forEach((dg, j) => {
        const n = dg === 'APP' ? approach(seg, next) : br + DEG[seg.q][dg];
        add('bass', seg.s + j * PPQ, 440, n, (j === 0 ? 92 : 82) * k);
      });
    } else {
      BASS[S].filter(h => h[0] < L).forEach(([t, d, dg]) => {
        const n = dg === 'APP' ? approach(seg, next) : br + DEG[seg.q][dg];
        add('bass', seg.s + t, Math.min(d, L - t - 10), n, (t % PPQ === 0 ? 96 : 78) * k);
      });
    }
    // 鍵盤（コードの残り長さでクランプ）
    const pat = S === 'jazz' ? (bar.index % 2 ? KEYS.jazzB : KEYS.jazzA) : KEYS[S];
    pat.filter(h => h[0] < L).forEach(([t, d, v]) => {
      vo.forEach(n => add('keys', seg.s + t, Math.min(d, L - t - 10), n, v * k));
    });
  });

  // --- 仮歌（英詞）。各行は4小節の頭2小節だけ歌い、残り2小節はギターが応える（コール＆レスポンス） ---
  // 音はキーのマイナー＋メジャー・ペンタから、その瞬間に鳴っているベース・鍵盤と半音でぶつからないものだけを選ぶ
  const mood = o.mood && o.mood !== 'auto' ? o.mood : moodFor(S, o.prog);
  const vocalChoruses = vocalChorusesFor(N).filter(ci => ci !== stopChorus);
  const vocalLines = [];
  if (o.vocal) {
    const pitched = ev.slice();
    let tonicV = 60 + o.key; if (tonicV > 67) tonicV -= 12;          // Mai 2 が歌いやすい G3〜D5 に収める
    const SWING = S === 'shuffle' || S === 'slow' || S === 'jazz';
    const slotTick = j => Math.floor(j / 2) * PPQ + (j % 2 ? (SWING ? 320 : 240) : 0);
    const OFFS = [-5,-3,-2,0,2,3,4,5,7,9,10,12,14];
    const segAt = t => segsAll.find(s => t >= s.s && t < s.e) || segsAll[segsAll.length - 1];
    let prev = tonicV + 7;
    vocalChoruses.forEach((ci, vi) => {
      const verse = LYRICS[mood].verses[vi % 3];
      [verse[0], verse[0], verse[1]].forEach((line, li) => {
        const bar = bars.find(b => b.chorus === ci && b.formBar === li * 4);
        const words = line.split(/\s+/), n = words.length;
        const F = Math.max(n - 1, 8);                                 // 最後の語は2小節目の頭あたりから伸ばす
        const starts = words.map((w, i) => slotTick(i === n - 1 ? F : Math.floor(i * F / (n - 1))));
        const L = { start: bar.t0 + starts[0], end: bar.t0 + 7 * PPQ, text: line, words: [] };
        words.forEach((w, i) => {
          const t = bar.t0 + starts[i];
          const dur = (i === n - 1 ? bar.t0 + 7 * PPQ - 40 : bar.t0 + starts[i + 1] - 20) - t;
          const p = i / (n - 1);
          const target = tonicV + (i === n - 1 ? 0 : p < 0.4 ? 3 + 9 * (p / 0.4) : 12 - 12 * ((p - 0.4) / 0.6));
          const seg = segAt(t), ct = CHORD_TONES[seg.q].map(x => (seg.root + x) % 12);
          const snd = pitched.filter(e => e.tick < t + dur && e.tick + e.dur > t).map(e => e.note);
          let best = tonicV, bestScore = Infinity;
          OFFS.forEach(off => {
            const cand = tonicV + off;
            if (cand < 55 || cand > 74) return;
            const score = 100 * snd.filter(x => semitoneClash(cand, [x])).length + Math.abs(cand - target)
              + (starts[i] % PPQ === 0 && !ct.includes(cand % 12) ? 2 : 0) + (Math.abs(cand - prev) > 7 ? 4 : 0)
              + (i === n - 1 && cand % 12 !== seg.root ? 3 : 0);
            if (score < bestScore) { bestScore = score; best = cand; }
          });
          prev = best;
          const lyric = w.replace(/[,.]/g, '');
          ev.push({ part: 'vocal', tick: t, dur, note: best, vel: i === 0 ? 92 : 86, lyric, wi: i });
          L.words.push({ tick: t, w });
        });
        vocalLines.push(L);
      });
    });
  }

  // --- ドラム（GM 番号のまま。AD2 の Map＝General MIDI 型で鳴る） ---
  const D = { kick:36, stick:37, snare:38, floor:43, hat:42, pedal:44, midTom:45, open:46, hiTom:48, crash:49, ride:51 };
  bars.forEach(bar => {
    const t0 = bar.t0, k = intensity(bar);
    const dr = (t, n, v) => add('drums', t0 + t, 60, n, v * k);
    if (bar.ring) return;
    if (bar.end) { dr(0, D.crash, 112); dr(0, D.kick, 110); dr(0, D.snare, 90); return; }
    if (bar.stop) { dr(0, D.crash, 108); dr(0, D.kick, 104); [480, 960, 1440].forEach(t => dr(t, D.pedal, 60)); return; }
    if (bar.crash) dr(0, D.crash, 100);
    const useRide = S === 'jazz' || (bar.section !== 'intro' && bar.chorus % 2 === 1);
    const tk = useRide ? D.ride : D.hat;
    const fillFrom = bar.fill ? 1440 : BAR;
    const tkHit = (t, v) => { if (t < fillFrom && !(bar.crash && t === 0)) dr(t, tk, v); };
    if (S === 'shuffle') {
      for (let b = 0; b < 4; b++) { tkHit(b * PPQ, b % 2 ? 88 : 80); tkHit(b * PPQ + 320, 54); }
      dr(0, D.kick, 92); dr(960, D.kick, 82);
      dr(480, D.snare, 96); if (!bar.fill) dr(1440, D.snare, 100);
    } else if (S === 'straight') {
      for (let j = 0; j < 8; j++) tkHit(j * 240, j % 2 ? 58 : 84);
      dr(0, D.kick, 96); dr(960, D.kick, 88); dr(1200, D.kick, 70);
      dr(480, D.snare, 100); if (!bar.fill) dr(1440, D.snare, 104);
    } else if (S === 'slow') {
      for (let j = 0; j < 12; j++) tkHit(j * 160, j % 3 ? 44 : 74);
      dr(0, D.kick, 90); dr(960, D.kick, 80); dr(1280, D.kick, 58);
      dr(480, D.snare, 92); if (!bar.fill) dr(1440, D.snare, 98);
    } else if (S === 'heavy') {
      // ルーズなロック8ビート。2コーラスに1回はフロアタムで刻む（60s ブリティッシュ・ブルースロック）
      const tomTime = bar.section !== 'intro' && bar.chorus % 2 === 1;
      for (let j = 0; j < 8; j++) {
        if (tomTime) { if (j * 240 < fillFrom) dr(j * 240, D.floor, j % 2 ? 62 : 86); }
        else tkHit(j * 240, j % 2 ? 60 : 86);
      }
      dr(0, D.kick, 100); dr(720, D.kick, 84); dr(960, D.kick, 96);
      dr(480, D.snare, 104); if (!bar.fill) dr(1440, D.snare, 108);
    } else if (S === 'funk') {
      for (let j = 0; j < 16; j++) tkHit(j * 120, j % 4 === 0 ? 84 : j % 2 ? 46 : 64);
      if (bar.index % 4 === 3 && !bar.fill) dr(1680, D.open, 70);
      dr(0, D.kick, 100); dr(600, D.kick, 82); dr(1080, D.kick, 88);
      dr(480, D.snare, 104); dr(840, D.snare, 34); if (!bar.fill) { dr(1440, D.snare, 106); dr(1800, D.snare, 32); }
    } else if (S === 'half') {
      // ハーフタイム：スネアは3拍目だけ、キックは16分の2連打で重さを出す
      for (let j = 0; j < 8; j++) tkHit(j * 240, j % 2 ? 56 : 82);
      dr(0, D.kick, 110); dr(120, D.kick, 84); dr(1200, D.kick, 92); dr(1320, D.kick, 100);
      dr(960, D.snare, 118);
    } else {
      [[0,78],[480,90],[800,54],[960,78],[1440,90],[1760,54]].forEach(([t, v]) => tkHit(t, v));
      dr(480, D.pedal, 66); dr(1440, D.pedal, 66);
      for (let b = 0; b < 4; b++) dr(b * PPQ, D.kick, 30);
      const m = bar.index % 4;
      if (m === 1) dr(1280, D.snare, 46);
      if (m === 3 && !bar.fill) { dr(800, D.snare, 42); dr(1760, D.snare, 52); }
    }
    if (bar.fill) {
      // タム回し（ロック系）：高→低へ。half は16分3連で畳みかける
      const TOMS = [D.hiTom, D.hiTom, D.midTom, D.midTom, D.floor, D.floor];
      const f = S === 'straight' ? [[1440,72],[1560,80],[1680,90],[1800,104]]
              : S === 'jazz'     ? [[1440,64],[1760,86]]
              : S === 'heavy' || S === 'funk' ? [[1440,90,D.snare],[1560,92,D.hiTom],[1680,96,D.midTom],[1800,104,D.floor]]
              : S === 'half'     ? [0,1,2,3,4,5].map(j => [1440 + j * 80, 84 + j * 5, TOMS[j]])
              : [[1440,74],[1600,88],[1760,104]];
      f.forEach(([t, v, n]) => dr(t, n || D.snare, v));
      dr(1440, D.kick, 70);
      if (STYLES[S].rock) dr(1800, D.kick, 90);
    }
  });

  ev.sort((a, b) => a.tick - b.tick || (a.part > b.part ? 1 : -1));
  const spt = 60 / plan.bpm / PPQ;
  ev.forEach(e => { e.time = e.tick * spt; e.sec = e.dur * spt; });
  return { ...plan, bars, segs: segsAll, events: ev, spt, totalTicks: bars.length * BAR, stopChorus,
           mood, vocal: !!o.vocal, vocalChoruses, vocalLines, key: o.key, minor: P.minor };
}

// ===== MIDI 書き出し（SMF format 1） =====
function buildMidi(song, opts) {
  const vlq = n => { const b = [n & 127]; while ((n >>= 7)) b.unshift((n & 127) | 128); return b; };
  const str = s => Array.from(new TextEncoder().encode(s));
  const track = (name, ch, program, part, extra) => {
    const evs = [];
    (extra || []).forEach(x => evs.push(x));
    evs.push({ t: 0, o: 0, d: [0xff, 0x03, ...vlq(str(name).length), ...str(name)] });
    if (program != null) evs.push({ t: 0, o: 1, d: [0xc0 | ch, program] });
    song.events.filter(e => e.part === part).forEach(e => {
      if (e.lyric) evs.push({ t: e.tick, o: 3, d: [0xff, 0x05, ...vlq(str(e.lyric).length), ...str(e.lyric)] });
      evs.push({ t: e.tick, o: 4, d: [0x90 | ch, e.note, e.vel] });
      evs.push({ t: e.tick + e.dur, o: 2, d: [0x80 | ch, e.note, 0] });
    });
    evs.sort((a, b) => a.t - b.t || a.o - b.o);
    let last = 0; const bytes = [];
    evs.forEach(e => { bytes.push(...vlq(e.t - last), ...e.d); last = e.t; });
    bytes.push(0, 0xff, 0x2f, 0);
    const n = bytes.length;
    return [0x4d,0x54,0x72,0x6b, n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255, ...bytes];
  };
  const us = Math.round(60000000 / song.bpm);
  const meta = [
    { t: 0, o: 0, d: [0xff, 0x51, 3, us >>> 16, (us >>> 8) & 255, us & 255] },
    { t: 0, o: 0, d: [0xff, 0x58, 4, 4, 2, 24, 8] },
  ];
  const keysPC = { organ: 16, ep: 4, piano: 0 }[opts.keysSound] ?? 0;
  const tracks = [
    track(opts.title, 0, null, '__none__', meta),
    track('Drums', 9, null, 'drums'),
    track('Bass', 1, null, 'bass'),
    track('Keys', 2, keysPC, 'keys'),
  ];
  // 仮歌：ch4・Voice Oohs（GM 54）。歌詞メタイベント付き（.svp が読めないときの保険）
  if (song.vocal) tracks.push(track('Vocal (' + LYRICS[song.mood].title + ')', 3, 54, 'vocal'));
  const head = [0x4d,0x54,0x68,0x64,0,0,0,6,0,1,0,tracks.length,(PPQ >> 8) & 255, PPQ & 255];
  return new Uint8Array([...head, ...tracks.flat()]);
}

// ===== SynthV Studio 2 (.svp) 書き出し：Mai 2・英語（arpabet）。4分音符 = 705600000 blick =====
const BLICK = 705600000;
const uuid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => { const r = Math.random() * 16 | 0; return (ch === 'x' ? r : (r & 3 | 8)).toString(16); });
/* 息継ぎ（歌詞 "br" の音符）を秒で決めて入れる。フレーズ頭・休みのあとに 0.15〜0.45秒（長い休みは最大 0.6秒）。
   ns は拍単位 {t, dur, midi, lyric, k}（k＝行の中の語番号。0 が行頭） */
function withBreaths(ns, bpm) {
  const spb = 60 / bpm, out = [];
  ns.forEach(n => {
    const p = out.length ? out[out.length - 1] : null;
    const gapS = p ? (n.t - (p.t + p.dur)) * spb : n.t * spb;
    if ((n.k === 0 || gapS >= 0.5) && gapS >= 0.2) {
      const d = Math.min(gapS >= 1.5 ? 0.6 : 0.45, Math.max(0.15, gapS * 0.7), gapS - 0.04);
      if (d >= 0.1) out.push({ t: n.t - d / spb, dur: d / spb, midi: n.midi, lyric: 'br' });
    }
    out.push({ ...n });
  });
  return out;
}
function buildSVP(song, breath) {
  const V = song.events.filter(e => e.part === 'vocal')
    .map(e => ({ t: e.tick / PPQ, dur: e.dur / PPQ, midi: e.note, lyric: e.lyric, k: e.wi }));
  const ns = (breath ? withBreaths(V, song.bpm) : V).map(x => ({
    musicalType: 'singing', onset: Math.round(x.t * BLICK), duration: Math.round(x.dur * BLICK),
    lyrics: x.lyric, phonemes: '', accent: '', pitch: x.midi, detune: 0, instantMode: false,
    attributes: { dF0Left: 0.0, dF0Right: 0.0, dF0Vbr: 0.0, evenSyllableDuration: true } }));
  const EMPTY = { mode: 'cubic', points: [] }, GID = uuid(), L = LYRICS[song.mood];
  return {
    version: 196, uuid: uuid(),
    time: { meter: [{ index: 0, numerator: 4, denominator: 4 }], tempo: [{ position: 0, bpm: song.bpm }], startTimeSeconds: 0.0 },
    library: [],
    tracks: [{
      name: 'Vocal - ' + L.title, dispColor: 'ff7db235', dispOrder: 0, renderEnabled: true,
      mixer: { gainDecibel: 0.0, pan: 0.0, mute: false, solo: false, display: true, fxPresetName: '', fxParams: {} },
      mainGroup: { name: 'main', uuid: GID,
        parameters: Object.fromEntries(['pitchDelta','vibratoEnv','loudness','tension','breathiness','voicing','gender','toneShift','mouthOpening'].map(k => [k, { ...EMPTY }])),
        vocalModes: {}, pitchControls: [],
        musicalScale: { type: song.minor ? 'Minor' : 'Major', root: SHARP[song.key] },
        notes: ns },
      mainRef: { uuid: uuid(), groupID: GID, blickAbsoluteBegin: 0, blickAbsoluteEnd: -1, blickOffset: 0, pitchOffset: 0, mute: false, isInstrumental: false,
        database: { name: 'Mai 2', language: 'english', phoneset: 'arpabet', languageOverride: '', phonesetOverride: '', backendType: 'SVR3', version: '200' },
        dictionary: '', voice: { vocalModeInherited: true, vocalModePreset: '', vocalModeParams: {}, choirSeatingSeparation: 0.699999988079071 },
        voicePresetName: '', takes: { activeTakeId: 0, takes: [{ id: 0, seedDuration: 0, seedPitch: 0, seedTimbre: 0, liked: false }] } },
      groups: [] }],
    renderConfig: { destination: '', filename: L.title, numChannels: 1, aspirationFormat: 'noAspiration', bitDepth: 16, sampleRate: 44100,
      exportMixDown: true, exportPitch: false, bypassPan: false, bypassGain: false, bypassEffects: false },
    projectMixer: { linkRoomSettings: true },
  };
}
</script>

<script>
// ===== 音源（Web Audio。プレビューと WAV 書き出しで共通） =====
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);

function makeRig(ctx) {
  const noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
  const master = ctx.createGain(); master.gain.value = 0.8;
  master.connect(comp); comp.connect(ctx.destination);
  const ir = ctx.createBuffer(2, ctx.sampleRate * 1.8, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const verbGain = ctx.createGain(); verbGain.gain.value = 0.22;
  verb.connect(verbGain); verbGain.connect(master);
  const parts = {};
  ['drums', 'bass', 'keys', 'vocal'].forEach(p => {
    parts[p] = ctx.createGain(); parts[p].connect(master);
  });
  const keySend = ctx.createGain(); keySend.gain.value = 0.6; parts.keys.connect(keySend); keySend.connect(verb);
  const voxSend = ctx.createGain(); voxSend.gain.value = 0.7; parts.vocal.connect(voxSend); voxSend.connect(verb);
  const drumSend = ctx.createGain(); drumSend.gain.value = 0.25; parts.drums.connect(drumSend); drumSend.connect(verb);
  return { ctx, noise, parts, master };
}

function env(g, t, a, peak, hold, rel) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + a + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
}
function noiseHit(rig, t, type, freq, q, peak, decay, out) {
  const { ctx } = rig;
  const src = ctx.createBufferSource(); src.buffer = rig.noise;
  src.playbackRate.value = 0.9 + Math.random() * 0.2;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); env(g, t, 0.001, peak, 0, decay);
  src.connect(f); f.connect(g); g.connect(out);
  src.start(t, Math.random()); src.stop(t + decay + 0.05);
}
function toneHit(rig, t, wave, f0, f1, peak, decay, out) {
  const { ctx } = rig;
  const o = ctx.createOscillator(); o.type = wave;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + decay * 0.6);
  const g = ctx.createGain(); env(g, t, 0.001, peak, 0, decay);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + decay + 0.05);
}

function playDrum(rig, n, t, v) {
  const out = rig.parts.drums, a = v / 127;
  switch (n) {
    case 36: toneHit(rig, t, 'sine', 130, 42, 1.0 * a, 0.42, out); noiseHit(rig, t, 'lowpass', 1200, 0.7, 0.12 * a, 0.02, out); break;
    case 38: toneHit(rig, t, 'triangle', 220, 160, 0.42 * a, 0.1, out); noiseHit(rig, t, 'highpass', 1500, 0.7, 0.5 * a, 0.17, out); break;
    case 37: toneHit(rig, t, 'square', 1700, 900, 0.12 * a, 0.03, out); noiseHit(rig, t, 'bandpass', 2500, 2, 0.25 * a, 0.04, out); break;
    case 42: noiseHit(rig, t, 'highpass', 7500, 0.8, 0.28 * a, 0.045, out); break;
    case 44: noiseHit(rig, t, 'highpass', 6500, 0.8, 0.2 * a, 0.035, out); break;
    case 46: noiseHit(rig, t, 'highpass', 7000, 0.8, 0.26 * a, 0.35, out); break;
    case 51: noiseHit(rig, t, 'bandpass', 6200, 1.2, 0.3 * a, 0.55, out);
             toneHit(rig, t, 'square', 3150, 3100, 0.025 * a, 0.5, out); break;
    case 49: noiseHit(rig, t, 'highpass', 4000, 0.6, 0.38 * a, 1.6, out); break;
    case 41: case 43: case 45: case 47: case 48: case 50: {
      const f = { 41:82, 43:98, 45:118, 47:140, 48:165, 50:195 }[n];
      toneHit(rig, t, 'sine', f * 1.6, f, 0.8 * a, 0.45, out);
      noiseHit(rig, t, 'lowpass', 2500, 0.7, 0.12 * a, 0.08, out); break;
    }
  }
}
function playBass(rig, n, t, dur, v) {
  const { ctx } = rig, a = v / 127, f = mtof(n);
  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2;
  lp.frequency.setValueAtTime(1300, t); lp.frequency.exponentialRampToValueAtTime(420, t + 0.25);
  const g1 = ctx.createGain(); g1.gain.value = 0.32;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.75 * a, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.5 * a, t + Math.max(0.02, dur * 0.8));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.06);
  o1.connect(g1); g1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(rig.parts.bass);
  [o1, o2].forEach(o => { o.start(t); o.stop(t + dur + 0.1); });
}
function playKeys(rig, n, t, dur, v, sound) {
  const { ctx } = rig, a = v / 127 * 0.22, f = mtof(n);
  const g = ctx.createGain(); g.connect(rig.parts.keys);
  if (sound === 'organ') {
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(a, t + 0.01);
    g.gain.setValueAtTime(a, t + dur); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.07);
    [[1, 0.6], [2, 0.35], [3, 0.2], [4, 0.1]].forEach(([h, lv]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * h;
      const og = ctx.createGain(); og.gain.value = lv; o.connect(og); og.connect(g);
      o.start(t); o.stop(t + dur + 0.1);
    });
  } else if (sound === 'ep') {
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(a * 1.3, t + 0.004);
    g.gain.exponentialRampToValueAtTime(a * 0.45, t + Math.max(0.05, dur));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);
    const car = ctx.createOscillator(); car.type = 'sine'; car.frequency.value = f;
    const mod = ctx.createOscillator(); mod.type = 'sine'; mod.frequency.value = f;
    const mg = ctx.createGain(); mg.gain.setValueAtTime(f * 1.6, t); mg.gain.exponentialRampToValueAtTime(f * 0.15, t + 0.5);
    mod.connect(mg); mg.connect(car.frequency); car.connect(g);
    [car, mod].forEach(o => { o.start(t); o.stop(t + dur + 0.4); });
  } else {
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(a * 1.4, t + 0.003);
    g.gain.exponentialRampToValueAtTime(a * 0.35, t + 0.6);
    g.gain.setValueAtTime(a * 0.35, t + Math.max(0.6, dur) - 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.6, dur) + 0.25);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.connect(g);
    [['triangle', 1, 0.8], ['sine', 2, 0.3], ['sine', 3, 0.1]].forEach(([w, h, lv]) => {
      const o = ctx.createOscillator(); o.type = w; o.frequency.value = f * h;
      const og = ctx.createGain(); og.gain.value = lv; o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + Math.max(0.6, dur) + 0.3);
    });
  }
}
// 仮歌のプレビュー音（「アー」寄りのフォルマント＋遅れて掛かるビブラート）。本番の歌は SynthV で
function playVox(rig, n, t, dur, v) {
  const { ctx } = rig, f = mtof(n), a = v / 127 * 0.9;
  const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
  const lfo = ctx.createOscillator(); lfo.frequency.value = 5.3;
  const lg = ctx.createGain(); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.012, t + Math.min(0.6, dur));
  lfo.connect(lg); lg.connect(o.frequency);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(a, t + 0.04);
  g.gain.setValueAtTime(a, t + Math.max(0.05, dur - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.12);
  [[730, 5, 1], [1150, 7, 0.6], [2600, 9, 0.25]].forEach(([fr, q, lv]) => {
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = q;
    const bg = ctx.createGain(); bg.gain.value = lv; o.connect(bp); bp.connect(bg); bg.connect(g);
  });
  g.connect(rig.parts.vocal);
  [o, lfo].forEach(x => { x.start(t); x.stop(t + dur + 0.2); });
}
function playEvent(rig, e, t, sound) {
  if (e.part === 'vocal') playVox(rig, e.note, t, e.sec, e.vel);
  else if (e.part === 'drums') playDrum(rig, e.note, t, e.vel);
  else if (e.part === 'bass') playBass(rig, e.note, t, e.sec, e.vel);
  else playKeys(rig, e.note, t, e.sec, e.vel, sound);
}

// ===== UI =====
const $ = id => document.getElementById(id);

for (let s = 90; s <= 480; s += 30) LENGTHS.push(s);

const state = { key: 9, style: 'shuffle', prog: 'basic', bpm: 102, targetSec: 210, fit: false, stopTime: false, vocal: false, mood: 'auto' };
const mix = { drums: { vol: 0.9, mute: false }, bass: { vol: 0.9, mute: false }, keys: { vol: 0.7, mute: false }, vocal: { vol: 0.8, mute: false } };

function syncControls() {
  document.querySelectorAll('#keys button').forEach(b => b.classList.toggle('on', +b.dataset.k === state.key));
  $('style').value = state.style; $('prog').value = state.prog;
  $('bpmRange').value = state.bpm; $('bpm').value = song.bpm;
  $('len').value = state.targetSec; $('fit').checked = state.fit; $('stopTime').checked = state.stopTime;
  $('vocal').checked = state.vocal; $('mood').value = state.mood;
  $('bpmRange').disabled = $('bpm').disabled = false;
}

function changed(first) {
  const wasPlaying = playing, pos = currentPos();
  const oldBar = song ? Math.floor(pos / (song.spt * BAR)) : 0;
  if (playing) stop(true);
  song = buildSong({ ...state });
  try { localStorage.setItem('bluesBT.state', JSON.stringify(state)); } catch (e) {}
  syncControls();
  renderForm(); renderTimeline(); renderSummary();
  offset = first ? 0 : Math.min(oldBar, song.bars.length - 2) * BAR * song.spt;
  updateDisplay(offset);
  if (wasPlaying) play(offset, true);
}

function renderSummary() {
  renderVocal();
  const sc = song.stopChorus >= 0 ? `、ストップタイム＝第${song.stopChorus + 1}コーラス` : '';
  $('summary').innerHTML = `仕上がり <b>${fmt(song.sec)}</b>（${song.totalBars}小節）／ テンポ <b>${song.bpm}</b>${state.fit && song.bpm !== state.bpm ? '（微調整後）' : ''}<br>`
    + `イントロ4小節 → 12小節 × <b>${song.choruses}</b>コーラス → エンディング${sc}`;
  $('tTotal').textContent = fmt(song.sec);
  const kn = noteName(state.key, state.key, state.prog, '7');
  $('scaleHint').innerHTML = PROGS[state.prog].hint ? PROGS[state.prog].hint(kn) : PROGS[state.prog].minor
    ? `<b>${kn}マイナー・ペンタトニック</b> と <b>${kn}ブルース・スケール</b>が軸。♭VI7・V7 の小節はコードトーン（特に V7 の3度）を狙うと締まります。`
    : `<b>${kn}マイナー・ペンタ／${kn}ブルース・スケール</b>が基本。明るくしたい所は <b>${kn}メジャー・ペンタ</b>、各コードの3度（I7→IV7 で半音下がる音）を狙うとコード感が出ます。`;
}

function renderForm() {
  const f = $('form'); f.innerHTML = '';
  PROGS[state.prog].bars.forEach((bar, i) => {
    const d = document.createElement('div');
    d.innerHTML = `<small>${i + 1}</small>` + bar.map(ch => chordName((state.key + ch.d) % 12, ch.q, state.key, state.prog)).join(' ');
    f.appendChild(d);
  });
}

function sections() {
  const out = []; let cur = null;
  song.bars.forEach(b => {
    const label = b.section === 'intro' ? 'Intro' : b.section === 'ring' || b.end ? 'End' : String(b.chorus + 1);
    const key = b.section === 'intro' ? 'i' : b.end || b.ring ? 'e' : 'c' + b.chorus;
    if (!cur || cur.key !== key) { cur = { key, label, start: b.index, n: 0, stop: b.section === 'stop' }; out.push(cur); }
    cur.n++;
  });
  // エンディングの小節は最終コーラスの一部として扱う
  const e = out.find(s => s.key === 'e'), lastC = out[out.length - 2];
  if (e && lastC) { lastC.n += e.n; out.pop(); }
  return out;
}
function renderTimeline() {
  const tl = $('timeline'); tl.innerHTML = '';
  sections().forEach(s => {
    const d = document.createElement('div');
    d.style.flex = s.n; d.dataset.start = s.start; d.dataset.n = s.n;
    if (s.stop) d.classList.add('stop');
    d.innerHTML = `<span class="fill"></span><span style="position:relative">${s.label}${s.stop ? ' stop' : ''}</span>`;
    d.title = s.label === 'Intro' ? 'イントロ' : `第${s.label}コーラス` + (s.stop ? '（ストップタイム）' : '');
    d.onclick = () => { const t = s.start * BAR * song.spt; if (playing) { stop(true); play(t, true); } else { offset = t; updateDisplay(t); } };
    tl.appendChild(d);
  });
}

function ensureRig() {
  if (!rig) rig = makeRig(new (window.AudioContext || window.webkitAudioContext)());
  if (rig.ctx.state === 'suspended') rig.ctx.resume();
  applyMix();
}
function applyMix() {
  if (!rig) return;
  Object.keys(mix).forEach(p => rig.parts[p].gain.setTargetAtTime(mix[p].mute ? 0 : mix[p].vol, rig.ctx.currentTime, 0.02));
}
function currentPos() {
  if (!playing || !rig) return offset;
  return rig.ctx.currentTime - startAt + offset;
}

function play(from, noCount) {
  ensureRig();
  const ctx = rig.ctx, beat = 60 / song.bpm;
  let lead = 0.12;
  if ($('countIn').checked && !noCount) {
    for (let i = 0; i < 4; i++) playDrum(rig, 37, ctx.currentTime + lead + i * beat, i ? 80 : 110);
    lead += 4 * beat;
  }
  offset = from; startAt = ctx.currentTime + lead;
  idx = song.events.findIndex(e => e.time >= from - 1e-6); if (idx < 0) idx = song.events.length;
  playing = true;
  $('play').textContent = '■ 停止'; $('play').classList.add('playing');
  timer = setInterval(schedule, 25); schedule();
  raf = requestAnimationFrame(loop);
}
function schedule() {
  const ctx = rig.ctx, horizon = ctx.currentTime + 0.18, sound = $('keysSound').value;
  while (idx < song.events.length) {
    const e = song.events[idx], t = startAt + e.time - offset;
    if (t > horizon) break;
    if (t >= ctx.currentTime - 0.02) playEvent(rig, e, Math.max(t, ctx.currentTime), sound);
    idx++;
  }
  if (currentPos() > song.sec + 0.3) { stop(); offset = 0; updateDisplay(0); }
}
function stop(keepRigSilence) {
  if (!playing) return;
  offset = currentPos(); playing = false;
  clearInterval(timer); cancelAnimationFrame(raf);
  // 予約済みの音を止めるためにパートの出力を作り直す
  const old = rig; rig = null;
  try { old.master.gain.setTargetAtTime(0, old.ctx.currentTime, 0.015); } catch (e) {}
  setTimeout(() => old.ctx.close(), 200);
  $('play').textContent = '▶ 再生'; $('play').classList.remove('playing');
  if (!keepRigSilence) updateDisplay(offset);
}
function loop() { updateDisplay(currentPos()); if (playing) raf = requestAnimationFrame(loop); }

let lastBar = -2, lastSeg = null;
function updateDisplay(pos) {
  $('tNow').textContent = fmt(Math.min(pos, song.sec));
  if (pos < 0) { $('where').textContent = 'カウント中…'; return; }
  const tick = pos / song.spt;
  const barIdx = Math.min(song.bars.length - 1, Math.floor(tick / BAR));
  const bar = song.bars[barIdx];
  const beat = Math.floor((tick - bar.t0) / PPQ);
  document.querySelectorAll('#beats i').forEach((el, i) => el.classList.toggle('on', playing && i === beat));
  const si = song.segs.findIndex(s => tick >= s.s && tick < s.e);
  const seg = song.segs[si >= 0 ? si : song.segs.length - 1];
  if (seg !== lastSeg) {
    lastSeg = seg;
    $('chordNow').textContent = chordName(seg.root, seg.q, state.key, state.prog);
    const nx = song.segs[si + 1];
    $('chordNext').textContent = '次: ' + (nx && !nx.bar.ring ? chordName(nx.root, nx.q, state.key, state.prog) : '—');
    $('tones').innerHTML = CHORD_TONES[seg.q].map((iv, i) =>
      `<span class="${i ? '' : 'r'}">${noteName(seg.root + iv, state.key, state.prog, seg.q)}</span>`).join('')
      + `<span style="border:none;color:var(--sub)">（${TONE_LABEL[seg.q]}）</span>`;
  }
  if (barIdx !== lastBar) {
    lastBar = barIdx;
    document.querySelectorAll('#form div').forEach((d, i) => d.classList.toggle('cur', !bar.ring && i === bar.formBar && !(bar.end && i !== 11)));
    const label = bar.section === 'intro' ? 'イントロ' : bar.end || bar.ring ? 'エンディング'
      : `第${bar.chorus + 1}/${song.choruses}コーラス` + (bar.section === 'stop' ? '（ストップタイム）' : '');
    $('where').textContent = playing ? label : '停止中 — ' + label;
  }
  document.querySelectorAll('#timeline div').forEach(d => {
    const s = +d.dataset.start, n = +d.dataset.n;
    const p = Math.min(1, Math.max(0, (tick / BAR - s) / n));
    d.classList.toggle('cur', tick / BAR >= s && tick / BAR < s + n);
    d.querySelector('.fill').style.width = (p * 100) + '%';
  });
  updateLyric(tick, bar);
}

// ===== 仮歌の表示 =====
function renderVocal() {
  const L = LYRICS[song.mood];
  const auto = state.mood === 'auto' ? '（曲に合わせて自動）' : '';
  if (!song.vocal) {
    $('vocalInfo').innerHTML = `今はオフ。「ボーカル（英詞の仮歌）を付ける」をオンにするか、🎤 ボタンを押すと付きます。歌詞の雰囲気: <b>${L.name}</b>${auto}`;
    $('verses').innerHTML = ''; return;
  }
  const order = song.vocalChoruses.map(c => `第${c + 1}`).join('・');
  $('vocalInfo').innerHTML = `<b>「${L.title}」</b>— ${L.name}${auto}。${order}コーラスで歌い、間はギター・ソロ。`
    + `各行は4小節の最初の2小節だけ歌い、残り2小節はギターで応える（コール＆レスポンス）。`;
  $('verses').innerHTML = song.vocalChoruses.map((c, i) => {
    const [a, b] = L.verses[i % 3];
    return `<p><b>第${c + 1}コーラス</b><br>${a}<br>${a}<br>${b}</p>`;
  }).join('');
}
function updateLyric(tick, bar) {
  const el = $('lyricNow');
  if (!song.vocal) { el.innerHTML = ''; return; }
  const cur = song.vocalLines.find(l => tick >= l.start - PPQ / 2 && tick < l.end);
  if (cur) {
    el.innerHTML = cur.words.map(w => `<span class="${tick >= w.tick ? 'on' : ''}">${w.w}</span>`).join(' ');
    return;
  }
  const inVocal = song.vocalChoruses.includes(bar.chorus) && bar.section !== 'intro' && !bar.ring;
  const next = song.vocalLines.find(l => l.start > tick);
  el.innerHTML = `<span class="idle">${inVocal ? '🎸 ギターで応える' : bar.section === 'intro' ? 'イントロ' : bar.end || bar.ring ? '' : '🎸 ギター・ソロ'}`
    + (next ? `　次の歌: ${next.text}` : '') + '</span>';
}

// ===== 書き出し =====
function datePrefix() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}_`;
}
function baseName() {
  const kn = noteName(state.key, state.key, state.prog, '7') + (PROGS[state.prog].minor ? 'm' : '');
  const s = Math.round(song.sec);
  return `${datePrefix()}Blues_${kn}_${STYLES[state.style].tag}_${PROGS[state.prog].tag}_BPM${song.bpm}_${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}s`;
}
function download(data, name, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function exportSvp() {
  if (!song.vocal) { state.vocal = true; changed(); }       // オフのまま押されたら仮歌を付けてから書き出す
  const name = baseName();
  download(new TextEncoder().encode(JSON.stringify(buildSVP(song, true))), name + '.svp', 'application/json');
  $('status').textContent = `書き出し: ${name}.svp（Mai 2・英語。MIDI と同じ名前・1小節目起点なので Logic 上で揃います）`;
}
function exportMidi() {
  const name = baseName();
  download(buildMidi(song, { keysSound: $('keysSound').value, title: name }), name + '.mid', 'audio/midi');
  $('status').textContent = `書き出し: ${name}.mid（Drums=ch10 GM配列 / Bass=ch2 / Keys=ch3${song.vocal ? ' / Vocal=ch4 歌詞付き' : ''}）`;
}
async function exportWav() {
  const btn = $('dlWav'); btn.disabled = true;
  $('status').textContent = 'WAV をレンダリング中…（数十秒かかります）';
  try {
    const sr = 44100, len = Math.ceil((song.sec + 1.5) * sr);
    const ctx = new OfflineAudioContext(2, len, sr);
    const r = makeRig(ctx);
    Object.keys(mix).forEach(p => r.parts[p].gain.value = mix[p].mute ? 0 : mix[p].vol);
    const sound = $('keysSound').value, CHUNK = 5;
    // 全音を一度に予約するとノードが膨らんで極端に遅くなるので、5秒ずつ区切って予約する
    const put = from => song.events.forEach(e => {
      if (e.time >= from && e.time < from + CHUNK) playEvent(r, e, e.time + 0.05, sound);
    });
    put(0);
    for (let t = CHUNK; t < song.sec; t += CHUNK) {
      ctx.suspend(t).then(() => { put(t); $('status').textContent = `WAV をレンダリング中… ${Math.round(t / song.sec * 100)}%`; ctx.resume(); });
    }
    const buf = await ctx.startRendering();
    download(encodeWav(buf), baseName() + '.wav', 'audio/wav');
    $('status').textContent = `書き出し: ${baseName()}.wav（${fmt(buf.duration)}）`;
  } catch (err) {
    $('status').textContent = 'WAV の書き出しに失敗しました: ' + err.message;
  }
  btn.disabled = false;
}
function encodeWav(buf) {
  const ch = buf.numberOfChannels, n = buf.length, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * ch * 2, true);
  out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch)].map((_, i) => buf.getChannelData(i));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
    const s = Math.max(-1, Math.min(1, data[c][i])); out.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
  }
  return out.buffer;
}

initUI();
